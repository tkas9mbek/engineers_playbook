name: playbook_toolkit

description: "Framework-level helpers shared by the playbook examples: exceptions, repository executors, mock network, form utils."

publish_to: 'none'

version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  equatable: ^2.0.7
  flutter_form_builder: ^10.1.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  mask_text_input_formatter: ^2.9.0

dev_dependencies:
  build_runner: ^2.12.0
  freezed: ^3.2.5
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
